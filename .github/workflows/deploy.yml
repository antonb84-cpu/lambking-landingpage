# LambKing: Bei jedem Push auf main automatisch prüfen, bauen und
# auf GitHub Pages veröffentlichen. Der lokale Admin pusht nur main –
# das Deployment übernimmt komplett GitHub.
name: LambKing bauen & veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nur ein Lauf gleichzeitig
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test

      - name: Build (inkl. Rechtsseiten, Sitemap, JSON-LD)
        run: npm run build

      - name: Netzwerk-Reinheit prüfen (keine Google-Fonts-/TikTok-/Ko-fi-Requests im Build)
        run: |
          ! grep -ri "fonts.googleapis.com\|fonts.gstatic.com\|tiktok\|storage.ko-fi.com" dist/ && echo "Build ist sauber ✓"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
