name = "lambking-anonymous-counter"
main = "src/index.js"
compatibility_date = "2026-09-01"
preview_urls = false

[vars]
ALLOWED_ORIGINS = "https://lambking.store,https://www.lambking.store,https://antonb84-cpu.github.io,http://localhost:8123,http://localhost:3000"

[[d1_databases]]
binding = "DB"
database_name = "lambking-analytics"
database_id = "__DATABASE_ID__"

[observability]
enabled = false

[observability.logs]
enabled = false
invocation_logs = false
