<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!-- Lokale Vorschau: Auf /creator-partner/ müssen relative Pfade (Bilder, Schriften) eine Ebene höher
         gesucht werden. Der Produktions-Build setzt dieses <base> selbst (scripts/postbuild.mjs). -->
    <script>
      if (!document.querySelector('base') && /\/creator-partner\/?$/.test(location.pathname)) {
        var b = document.createElement('base')
        b.setAttribute('href', location.pathname.replace(/creator-partner\/?$/, ''))
        document.head.appendChild(b)
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>LambKing Stories – Bibelgeschichten zum Ausmalen</title>
    <meta
      name="description"
      content="Biblisch fundierte Malbücher und Kinderbücher von LambKing Stories. Inhalt ansehen und direkt bei Amazon bestellen."
    />
    <link rel="canonical" href="https://lambking.store/" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#1f4393" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LambKing Stories" />
    <meta property="og:title" content="LambKing Stories – Bibelgeschichten zum Ausmalen" />
    <meta
      property="og:description"
      content="Biblisch fundierte Malbücher und Kinderbücher. Inhalt ansehen und direkt bei Amazon bestellen."
    />
    <meta property="og:url" content="https://lambking.store/" />
    <meta property="og:image" content="https://lambking.store/images/og-lambking.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="LambKing Stories – Jesus erzählt Kindern eine Geschichte, ein kleines Lamm mit Krone sitzt davor" />
    <meta property="og:locale" content="de_DE" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LambKing Stories – Bibelgeschichten zum Ausmalen" />
    <meta
      name="twitter:description"
      content="Biblisch fundierte Malbücher und Kinderbücher. Inhalt ansehen und direkt bei Amazon bestellen."
    />
    <meta name="twitter:image" content="https://lambking.store/images/og-lambking.jpg" />

    <link rel="icon" type="image/png" href="./images/logo-icon-96.png" />
    <link rel="preload" as="image" type="image/webp" href="./images/hero-titel-breit.webp" media="(min-width: 1280px)" fetchpriority="high" />
    <link rel="preload" as="image" type="image/webp" href="./images/hero-titel.webp" media="(min-width: 768px) and (max-width: 1279px)" fetchpriority="high" />
    <link rel="preload" as="image" type="image/webp" href="./images/hero-titel-mobil.webp" media="(max-width: 767px)" fetchpriority="high" />

    <!-- Lokale Schriften (OFL-Lizenz) – keine Verbindung zu Google Fonts.
         Relative Pfade lösen auf jeder Unterseite korrekt auf. -->
    <style>
      @font-face {
        font-family: 'Fraunces';
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url('fonts/Fraunces-var-latin-ext.woff2') format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304,
          U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB,
          U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: 'Fraunces';
        font-style: normal;

        font-display: swap;

        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
          U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215,
          U+FEFF, U+FFFD;

          U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB,
          U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }

          U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215,
          U+FEFF, U+FFFD;
      }

  </head>

    <div id="root"></div>

  </body>
</html>
